name: Build Ghostscript WASM

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t ghostscript-wasm .

      - name: Build WASM artifacts
        run: docker run --rm -v "$PWD:/project" ghostscript-wasm

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghostscript-wasm
          path: |
            dist/ghostscript.js
            dist/ghostscript.wasm
            dist/ghostscript.worker.js
          if-no-files-found: error

      - name: Run tests
        run: docker run --rm -v "$PWD:/project" ghostscript-wasm bash scripts/test.sh
