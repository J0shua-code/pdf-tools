name: Build Ghostscript WASM

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the reproducible build environment image.
      - name: Build Docker image
        run: docker build -t ghostscript-wasm .

      # The image's default command downloads the pinned source, configures,
      # compiles the WASM engine and copies it into dist/. It runs inside the
      # container so the Emscripten toolchain is not needed on the runner.
      - name: Download source and compile WASM
        run: docker run --rm -v "$PWD:/project" ghostscript-wasm

      - name: Verify build artifacts
        run: |
          ls -lh dist/
          test -f dist/ghostscript.js
          test -f dist/ghostscript.wasm
          test -f dist/ghostscript.worker.js
          test -f dist/presets.js

      # Tests run with Node on the runner (they only need dist/ + source).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: |
          node tests/integration.test.js
          node tests/features.test.js
          node tests/worker.test.js

      # Demonstrate the end-to-end pipeline (worker -> WASM -> pdfwrite).
      - name: Run sample compression
        run: node scripts/sample-compress.js tests/input/simple.pdf balanced

      # Build + test the publishable package (@project/ghostscript-wasm).
      - name: Build and test package
        run: |
          npm --prefix packages/ghostscript-wasm ci
          npm --prefix packages/ghostscript-wasm run build
          npm --prefix packages/ghostscript-wasm test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghostscript-wasm
          path: |
            dist/ghostscript.js
            dist/ghostscript.wasm
            dist/ghostscript.worker.js
            dist/presets.js
            dist/package.json
          if-no-files-found: error